name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: Scripts/test.sh
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build release
        run: |
          # Without secrets this produces an ad-hoc signed, non-notarized build.
          if [ -z "$MACOS_CERTIFICATE" ]; then unset CODESIGN_IDENTITY APPLE_ID; fi
          VERSION="${GITHUB_REF_NAME#v}" Scripts/release.sh | tee release.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Unmark ${GITHUB_REF_NAME}"
            echo
            grep -E "signature|notarized|sha256" release.txt | sed 's/^ */- /'
            if grep -q "notarized:  no" release.txt; then
              echo
              echo "This build is not notarized. See the README for how to open it."
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --title "Unmark ${GITHUB_REF_NAME}" --notes-file notes.md
